[project]
name = "quadrant-task-manager"
version = "0.1.0"
description = "A PyQt6 four-quadrant task manager with sorting, drag-and-drop, reminders, archive, and i18n."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
]

[project.scripts]
mytask = "app.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "DTZ001",  # naive datetime is intentional for local task manager
    "DTZ005",
    "UP007",   # Union[] syntax is fine for readability
    "RUF012",  # class-level dict is intentional constant
]

[tool.ruff.format]
exclude = ["README.md"]
